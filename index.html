    if (t.dataset.acc === 'nuevo') { m.form = { id: null, fecha: hoy(), articulo_id: '', cantidad: '', monto: '', proveedor: '', nota: '' }; pintar(); window.scrollTo(0, 0); }
    if (t.dataset.compra) {
      const c = S.datos.compras.find(x => x.id === t.dataset.compra); const a = articuloPor(c.insumo_id) || { unidad: 'unidad' };
      m.form = { id: c.id, fecha: c.fecha, articulo_id: c.insumo_id, cantidad: decTexto(c.cantidad / FACTOR[a.unidad]), monto: String(c.monto_total), proveedor: c.proveedor, nota: c.nota };
      pintar(); window.scrollTo(0, 0);
    }
  };
}
function pintarFormCompra() {
  const v = $('#vista'), f = S.mas.form;
  const arts = articulos(false);
  const actual = articuloPor(f.articulo_id);
  if (actual && !arts.find(a => a.id === actual.id)) arts.push(actual);
  const provs = [...new Set(S.datos.compras.map(c => c.proveedor).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  const opt = (a) => `<option value="${h(a.id)}" ${a.id === f.articulo_id ? 'selected' : ''}>${h(a.nombre)}</option>`;
  v.innerHTML = `<button type="button" class="btn plano volver" data-acc="cerrarForm">‹ Compras</button>
    <form class="card" id="fCompra" novalidate><h2>${f.id ? 'Editar compra' : 'Nueva compra'}</h2>
      <label class="campo">Fecha<input type="date" name="fecha" value="${h(f.fecha)}" max="${h(hoy())}"></label>
      <label class="campo">¿Qué se compró?<select name="articulo_id"><option value="">Elegir…</option>
        <optgroup label="Insumos">${arts.filter(a => a.tipo === 'insumo').map(opt).join('')}</optgroup>
        ${arts.some(a => a.tipo === 'reventa') ? `<optgroup label="Productos de reventa">${arts.filter(a => a.tipo === 'reventa').map(opt).join('')}</optgroup>` : ''}</select></label>
      <label class="campo">Cantidad<div class="con-unidad"><input class="entrada" name="cantidad" type="text" inputmode="decimal" value="${h(f.cantidad)}" placeholder="0"><span id="uCant">${actual ? GRANDE[actual.unidad] : ''}</span></div></label>
      <label class="campo">Monto pagado (total)<div class="pesos-in"><input class="entrada" name="monto" type="text" inputmode="numeric" pattern="[0-9]*" value="${h(f.monto)}" placeholder="0"></div></label>
      <p class="ayuda" id="preCompra" style="margin-top:-6px"></p>
      <label class="campo">Proveedor <span class="muted" style="font-weight:400">(opcional)</span><input name="proveedor" value="${h(f.proveedor)}" list="listaProv" maxlength="80" autocomplete="off"></label>
      <datalist id="listaProv">${provs.map(p => `<option value="${h(p)}">`).join('')}</datalist>
      <label class="campo">Nota <span class="muted" style="font-weight:400">(opcional)</span><input name="nota" value="${h(f.nota)}" maxlength="300" autocomplete="off"></label>
      <button class="btn ancho" type="submit" data-guarda>Guardar</button>
    </form>
    ${f.id ? '<button type="button" class="btn peligro ancho" data-acc="borrar" data-guarda>Eliminar compra</button>' : ''}`;
  const previa = () => {
    const a = articuloPor(f.articulo_id), c = dec(f.cantidad), mo = ent(f.monto);
    $('#uCant').textContent = a ? GRANDE[a.unidad] : '';
    $('#preCompra').textContent = a && c > 0 && mo ? `= ${pesos(mo / c)} por ${GRANDE[a.unidad] === 'u' ? 'unidad' : GRANDE[a.unidad]}${a.tipo === 'insumo' && Number(S.datos.insumos.find(i => i.id === a.id)?.merma_porcentaje) ? ' (antes de la merma)' : ''}` : '';
  };
  previa();
  v.oninput = (e) => {
    const t = e.target;
    if (t.name === 'monto') { const l = t.value.replace(/\D/g, ''); if (l !== t.value) t.value = l; }
    if (t.name === 'cantidad') { const l = limpiarDec(t); if (l !== t.value) t.value = l; }
    sincronizar(f)(e); previa();
  };
  v.onchange = (e) => { sincronizar(f)(e); previa(); };
  $('#fCompra').addEventListener('submit', (e) => {
    e.preventDefault();
    const err = (m) => mostrarModal({ titulo: 'Revisa la compra', cuerpo: `<p>${m}</p>`, botones: [{ texto: 'Entendido' }] });
    const a = articuloPor(f.articulo_id);
    if (!a) return err('Elige qué se compró.');
    if (!(dec(f.cantidad) > 0)) return err('Escribe la cantidad comprada.');
    if (!ent(f.monto)) return err('Escribe el monto pagado.');
    escribir('guardarCompra', { id: f.id, fecha: f.fecha, articulo_id: a.id, cantidad: aBase(f.cantidad, a.unidad), monto_total: ent(f.monto), proveedor: f.proveedor.trim(), nota: f.nota.trim() }, uuid(), () => {
      S.mas.mes = f.fecha.slice(0, 7); S.mas.form = null; aviso('Compra guardada'); pintar(); window.scrollTo(0, 0);
    });
  });
  v.onclick = (e) => {
    const t = e.target.closest('button'); if (!t || t.closest('form') || clickComun(t)) return;
    if (t.dataset.acc === 'borrar') confirmarBorrar('Eliminar compra', `Se eliminará la compra de ${h(articuloPor(f.articulo_id)?.nombre || '')} por ${pesos(ent(f.monto))}. El costo y el inventario se recalculan.`, 'eliminarCompra', { id: f.id }, 'Compra eliminada');
  };
}

// ───────────────────────────── Inventario ─────────────────────────────
function pintarInventario() {
  const v = $('#vista'), m = S.mas;
  if (m.form) return pintarConteo();
  if (m.sel) return pintarArticulo(m.sel);
  v.oninput = v.onchange = null;
  const inv = S.datos.inventario;
  const lista = inv.articulos.filter(a => a.activo || a.stock !== null).sort((a, b) => (b.bajo - a.bajo) || a.nombre.localeCompare(b.nombre, 'es'));
  v.innerHTML = `${volverMas}<button type="button" class="btn ancho" data-acc="conteo" style="margin-bottom:12px" ${lista.length ? '' : 'disabled'}>Registrar conteo</button>
    ${inv.productosSinReceta.length ? `<div class="aviso warn">Se vendieron productos sin receta: ${h(inv.productosSinReceta.join(', '))}. Su consumo de insumos no se descuenta, así que el stock teórico puede estar alto.</div>` : ''}
    ${lista.length ? `<div class="card"><h2>Stock teórico</h2>${lista.map(a => `<button type="button" class="item-lista" data-art="${h(a.id)}"><div><div style="font-weight:600">${h(a.nombre)}</div>
        <div class="ayuda" style="margin:0">${a.ultimoConteo ? 'Contado el ' + h(fechaCorta(a.ultimoConteo.fecha)) : 'Necesita un conteo inicial'}</div></div>
        <div class="der">${a.stock === null ? '<span class="tag gris">sin conteo</span>' : `${cantGrande(a.stock, a.unidad)}${a.bajo ? '<div><span class="tag bad">stock bajo</span></div>' : ''}`}</div><span class="chev">›</span></button>`).join('')}</div>`
      : '<div class="card vacio">Agrega insumos (Más → Insumos) para ver su inventario.</div>'}
    <div class="aviso info"><b>Stock teórico</b> = último conteo + compras posteriores − lo que se usó según las recetas. No se guarda: se calcula. Cuando cuenten, la diferencia muestra la merma real.</div>`;
  v.onclick = (e) => {
    const t = e.target.closest('button'); if (!t || clickComun(t)) return;
    if (t.dataset.acc === 'conteo') { m.form = { fecha: hoy(), cant: {} }; pintar(); window.scrollTo(0, 0); }
    if (t.dataset.art) { m.sel = t.dataset.art; pintar(); window.scrollTo(0, 0); }
  };
}
function pintarArticulo(id) {
  const v = $('#vista'), a = S.datos.inventario.articulos.find(x => x.id === id);
  if (!a) { S.mas.sel = null; return pintar(); }
  v.oninput = v.onchange = null;
  const cg = (n) => cantGrande(n, a.unidad);
  v.innerHTML = `<button type="button" class="btn plano volver" data-acc="cerrarForm">‹ Inventario</button>
    <div class="card"><h2>${h(a.nombre)}</h2>${a.ultimoConteo ? `<table class="lineas">
      <tr><td>Último conteo (${h(fechaCorta(a.ultimoConteo.fecha))})</td><td>${cg(a.ultimoConteo.cantidad)}</td></tr>
      <tr><td>Compras posteriores</td><td>+ ${cg(a.compras)}</td></tr>
      <tr><td>Consumo según ventas${a.tipo === 'reventa' ? '' : ' y recetas'}</td><td>− ${cg(a.consumo)}</td></tr>
      <tr class="total"><td>Stock teórico</td><td>${cg(a.stock)}</td></tr>
      ${a.stockMinimo !== '' && a.stockMinimo !== null ? `<tr><td class="m">Stock mínimo</td><td class="m">${cg(a.stockMinimo)}</td></tr>` : ''}</table>
      ${a.bajo ? '<div class="aviso bad">Stock bajo: está en el mínimo o por debajo.</div>' : ''}`
      : '<p>Sin conteo: registra un conteo inicial para calcular su stock.</p>'}</div>
    ${a.historial.length ? `<div class="card"><h2>Conteos</h2><table class="rank"><thead><tr><th>Fecha</th><th class="n">Contado</th><th class="n">Teórico</th><th class="n">Diferencia</th><th></th></tr></thead><tbody>
      ${a.historial.slice().reverse().map(x => `<tr><td>${h(fechaCorta(x.fecha))}</td><td class="n">${cg(x.contado)}</td><td class="n muted">${x.teorico === null ? '—' : cg(x.teorico)}</td>
        <td class="n ${x.diferencia < 0 ? 'baja' : ''}">${x.diferencia === null ? '—' : (x.diferencia > 0 ? '+' : '') + cg(x.diferencia)}</td>
        <td class="n"><button type="button" class="btn plano" style="min-height:32px;padding:2px 6px;color:var(--bad)" data-borrarconteo="${h(x.id)}" aria-label="Eliminar conteo">×</button></td></tr>`).join('')}
      </tbody></table><p class="ayuda">Diferencia = contado − teórico. Si es negativa, se usó o perdió más de lo que dicen las recetas (merma real).</p></div>` : ''}`;
  v.onclick = (e) => {
    const t = e.target.closest('button'); if (!t || clickComun(t)) return;
    if (t.dataset.borrarconteo) confirmarBorrar('Eliminar conteo', 'Se eliminará este conteo. El stock teórico se recalcula con los conteos que queden.', 'eliminarConteo', { id: t.dataset.borrarconteo }, 'Conteo eliminado');
  };
}
function pintarConteo() {
  const v = $('#vista'), f = S.mas.form;
  const arts = S.datos.inventario.articulos.filter(a => a.activo).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  v.innerHTML = `<button type="button" class="btn plano volver" data-acc="cerrarForm">‹ Inventario</button>
    <div class="card"><h2>Registrar conteo</h2>
      <label class="campo">Fecha del conteo<input type="date" id="cFecha" value="${h(f.fecha)}" max="${h(hoy())}"></label>
      <p class="ayuda" style="margin-top:-6px">Cuenten <b>antes de abrir</b> y después de anotar las compras de ese día. Dejen en blanco lo que no contaron. La primera vez sirve como conteo inicial.</p>
      ${arts.map(a => `<div class="prod"><div class="prod-info"><div class="nombre">${h(a.nombre)}</div><div class="sub">${a.stock === null ? 'sin conteo' : 'teórico: ' + cantGrande(a.stock, a.unidad)}</div></div>
        <div class="con-unidad" style="width:130px"><input class="entrada" style="margin-top:0" type="text" inputmode="decimal" data-cont="${h(a.id)}" value="${h(f.cant[a.id] || '')}" placeholder="—" aria-label="Cantidad contada de ${h(a.nombre)}"><span>${GRANDE[a.unidad]}</span></div></div>`).join('')}
      <button type="button" class="btn ancho" data-acc="guardarConteo" data-guarda style="margin-top:12px">Guardar conteo</button></div>`;
  v.oninput = (e) => { const t = e.target; if (t.dataset.cont) { const l = limpiarDec(t); if (l !== t.value) t.value = l; f.cant[t.dataset.cont] = l; } };
  v.onchange = (e) => { if (e.target.id === 'cFecha') f.fecha = e.target.value; };
  v.onclick = (e) => {
    const t = e.target.closest('button'); if (!t || clickComun(t)) return;
    if (t.dataset.acc === 'guardarConteo') {
      const items = arts.filter(a => f.cant[a.id] !== undefined && f.cant[a.id] !== '').map(a => ({ articulo_id: a.id, cantidad: aBase(f.cant[a.id], a.unidad) }));
      if (!items.length) return mostrarModal({ titulo: 'Conteo vacío', cuerpo: '<p>Escribe al menos una cantidad contada.</p>', botones: [{ texto: 'Entendido' }] });
      if (items.some(x => isNaN(x.cantidad))) return mostrarModal({ titulo: 'Revisa el conteo', cuerpo: '<p>Hay una cantidad que no es un número.</p>', botones: [{ texto: 'Entendido' }] });
      escribir('guardarConteos', { fecha: f.fecha, items }, uuid(), () => { S.mas.form = null; aviso(`Conteo guardado (${items.length})`); pintar(); window.scrollTo(0, 0); });
    }
  };
}

// ───────────────────────────── Inicio ─────────────────────────────
document.addEventListener('visibilitychange', () => {
  // Al volver a la app después de un rato, se refrescan los datos (por si se corrigió algo en la planilla).
  if (document.visibilityState === 'visible' && S.clave && S.datos && !S.ocupado && Date.now() - S.cargadoEn > 5 * 60 * 1000) cargar(true);
});
pintar();
if (S.clave && URL_SCRIPT.indexOf('http') === 0) cargar();
</script>
</body>
</html>
